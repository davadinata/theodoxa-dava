  - title: "FinTrack AI Receipt Scanner"
    description: "Team project. I built the AI service that turns a photo of a receipt into a ready-to-save transaction using a vision LLM."
    technologies: ["Python", "FastAPI", "OpenRouter", "Docker", "React"]
    status: "completed"
    image: "/images/projects/fintrack-ai.png"
    url: "/projects/fintrack-ai"

